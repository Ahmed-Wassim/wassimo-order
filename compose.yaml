services:
  order:
    build: { context: ., dockerfile: Dockerfile.dev }
    volumes:
      - .:/app
      - gocache:/root/.cache/go-build
      - gomod:/go/pkg/mod
    ports: ["9054:8080"]
    env_file: [.env]
    environment:
      - PORT=${PORT}
      - ENV=${ENV}
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@order-db:5432/${POSTGRES_DB}?sslmode=disable
      - CART_SERVICE_URL=http://cart:8080
      - CATALOG_SERVICE_URL=http://catalog:8080
      - RATE_PRIMARY_URL=${RATE_PRIMARY_URL}
      - RATE_FALLBACK_URL=${RATE_FALLBACK_URL}
      - RABBITMQ_URL=amqp://wassimo:wassimo-dev-password@rabbitmq:5672
      - PAYMENT_SERVICE_URL=http://payment:8080
      - PAYMENT_API_KEY=${PAYMENT_API_KEY}
    depends_on: { order-db: { condition: service_healthy } }
    networks: [wassimo-network]

  order-prod:
    build: { context: ., dockerfile: Dockerfile }
    ports: ["9064:8080"]
    env_file: [.env]
    environment:
      - PORT=8080
      - ENV=prod
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@order-db:5432/${POSTGRES_DB}?sslmode=disable
      - CART_SERVICE_URL=http://cart:8080
      - CATALOG_SERVICE_URL=http://catalog:8080
      - RATE_PRIMARY_URL=${RATE_PRIMARY_URL}
      - RATE_FALLBACK_URL=${RATE_FALLBACK_URL}
      - RABBITMQ_URL=amqp://wassimo:wassimo-dev-password@rabbitmq:5672
      - PAYMENT_SERVICE_URL=http://payment:8080
      - PAYMENT_API_KEY=${PAYMENT_API_KEY}
    depends_on: { order-db: { condition: service_healthy } }
    networks: [wassimo-network]

  order-db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [order-pgdata:/var/lib/postgresql]
    ports: ["5443:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [wassimo-network]

volumes:
  order-pgdata: {}
  gocache: {}
  gomod: {}
networks: { wassimo-network: { external: true } }
